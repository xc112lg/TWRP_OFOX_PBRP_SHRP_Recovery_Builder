name: OrangeFox [OFRP] fix test

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree'
        required: true
        default: ''
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch (use master if default)'
        required: true
        default: 'main'
      LOCAL_MANIFEST:
        description: 'Local Manifest repo URL (optional — leave empty to skip)' # e.g. a repo containing local_manifest.xml with your device/kernel/vendor projects
        required: false
        default: ''
      LOCAL_MANIFEST_BRANCH:
        description: 'Local Manifest Branch'
        required: false
        default: 'main'
      DEVICE_NAME:
        description: 'Device Codename(s) — comma-separated for multi-device, e.g. h870, h872' # Must all be built by the same DEVICE_TREE/DEVICE_PATH below.
        required: true
        default: ''
      DEVICE_PATH:
        description: 'Specify your Device Path (Check the DEVICE_PATH in BoardConfig.mk)' # As is, just like your DEVICE_PATH in your BoardConfig.mk
        required: true
        default: ''
      BUILD_TARGET:
        description: 'Specify your Build Target' # The image suffix will be added later in build step.
        required: true
        default: 'recovery'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Use LDCHECK'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: 'Path of blobs to check' # Use it know what kind of dependencies your missing for decryption blobs.
        required: true
        default: 'system/bin/qseecomd'

jobs:
  prepare:
    name: Prepare device matrix
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    outputs:
      devices: ${{ steps.set.outputs.devices }}
    steps:
    - name: Parse, dedupe and sort DEVICE_NAME
      id: set
      run: |
        raw='${{ inputs.DEVICE_NAME }}'
        json=$(echo "$raw" \
          | tr ',' '\n' \
          | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
          | grep -v '^$' \
          | sort -u \
          | jq -R -s -c 'split("\n")[:-1]')
        if [ "$json" = "[]" ]; then
          echo "::error::No valid device codenames found in DEVICE_NAME."
          exit 1
        fi
        echo "devices=$json" >> "$GITHUB_OUTPUT"
        echo "Sorted device matrix: $json"

  build:
    name: Build OFRP (${{ matrix.device }}) by ${{ github.actor }}
    needs: prepare
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.prepare.outputs.devices) }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORANGEFOX_ROOT: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
      OUTPUT_DIR: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ matrix.device }}

    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
              
    - name: Clean-up
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12
      
    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: "10G"
      
    - name: Set-up Manifest # For github workspace use single {}
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Apply Local Manifest
      if: inputs.LOCAL_MANIFEST != ''
      run: |
        cd ${{ env.ORANGEFOX_ROOT }}
        rm -rf .repo/local_manifests
        if [ -n "${{ inputs.LOCAL_MANIFEST_BRANCH }}" ]; then
          git clone ${{ inputs.LOCAL_MANIFEST }} -b ${{ inputs.LOCAL_MANIFEST_BRANCH }} .repo/local_manifests
        else
          git clone ${{ inputs.LOCAL_MANIFEST }} .repo/local_manifests
        fi
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd ${{ env.ORANGEFOX_ROOT }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Building OrangeFox
      run: |
        pushd ${{ env.ORANGEFOX_ROOT }}
        set +e
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        # TW_NO_USB_STORAGE=false is passed here, not just in BoardConfig.mk,
        # because something downstream in the source tree keeps resetting it
        # back to true regardless of the device tree's own setting (confirmed
        # across multiple builds — BoardConfig.mk says false, recovery.log
        # still prints true at boot). A command-line make variable sits above
        # every in-tree ":=" assignment in Make's precedence order, so this
        # should win regardless of where the override is coming from. If the
        # next recovery.log STILL prints true even with this, the printed
        # value isn't a compile-time flag at all and the investigation needs
        # to move to TWRP's runtime/C++ defaults instead.
        lunch twrp_${{ matrix.device }}-eng && make clean && mka adbd TW_NO_USB_STORAGE=false ${{ inputs.BUILD_TARGET }}image
        BUILD_EXIT_CODE=$?
        set -e
        popd
        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "::error::mka exited with code $BUILD_EXIT_CODE — build did not complete cleanly."
          exit $BUILD_EXIT_CODE
        fi
        # OrangeFox's post-build hook (Fox_After_Recovery_Image) renames the
        # finished image straight to OrangeFox-<ver>-<type>-<device>.img —
        # a plain "recovery*.img"/"boot*.img" is never left behind. Check
        # both patterns so a successful OrangeFox-renamed build isn't
        # mistaken for a missing image.
        img_file=$(find "${{ env.OUTPUT_DIR }}" \( -name "${{ inputs.BUILD_TARGET }}*.img" -o -name "OrangeFox*.img" \) -print -quit)
        if [ -z "$img_file" ]; then
          echo "::error::mka reported success but no ${{ inputs.BUILD_TARGET }}*.img or OrangeFox*.img was found under ${{ env.OUTPUT_DIR }}. Check whether '${{ inputs.BUILD_TARGET }}image' is a valid make target for this device (e.g. BOARD_USES_RECOVERY_AS_BOOT may replace it with bootimage/vendorbootimage)."
          exit 1
        fi
        echo "Found image: $img_file"

    - name: Fix update-binary in flashable zip
      run: |
        zip_file=$(find "${{ env.OUTPUT_DIR }}" -name "OrangeFox*.zip" -print -quit)
        if [ -z "$zip_file" ]; then
          echo "No OrangeFox zip found under ${{ env.OUTPUT_DIR }} — nothing to patch."
          exit 0
        fi
        echo "Patching update-binary in $zip_file"
        work_dir=$(mktemp -d)
        unzip -o "$zip_file" META-INF/com/google/android/update-binary -d "$work_dir" >/dev/null
        ub="$work_dir/META-INF/com/google/android/update-binary"
        # SignApk re-zips without preserving Unix mode bits, so update-binary
        # loses its executable bit; and #!/system/bin/sh doesn't exist yet
        # when the updater is exec'd in recovery (system isn't mounted),
        # so TWRP fails to run it at all (Updater process ended with ERROR: 255,
        # no ui_print output). Fix both: shebang -> /sbin/sh, chmod 0755.
        sed -i '1s|^#!/system/bin/sh|#!/sbin/sh|' "$ub"
        chmod 0755 "$ub"
        head -1 "$ub"
        (cd "$work_dir" && zip -X "$zip_file" META-INF/com/google/android/update-binary)
        rm -rf "$work_dir"
        echo "Patched entry:"
        unzip -l "$zip_file" | grep update-binary

    - name: Set Build Date # Build date in UTC
      run: |
        echo "BUILD_DATE=$(TZ=UTC date +%Y%m%d)" >> $GITHUB_ENV

    - name: Check if the recovery exists # OrangeFox renames recovery.img to OrangeFox*.img — check that pattern, not the raw build-target name
      if: always()
      run: |
        img_file=$(find "${{ env.OUTPUT_DIR }}" \( -name "${{ inputs.BUILD_TARGET }}*.img" -o -name "OrangeFox*.img" \) -print -quit)
        zip_file=$(find "${{ env.OUTPUT_DIR }}" -name "OrangeFox*.zip" -print -quit)
        if [ -f "$img_file" ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum "$img_file" | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "Recovery out directory is empty."
        fi
        if [ -f "$zip_file" ]; then
            echo "CHECK_ZIP_IS_OK=true" >> $GITHUB_ENV
            echo "MD5_ZIP=$(md5sum "$zip_file" | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
            echo "::warning::The zip file isn't present but make sure the image is from only after 100% completion in build stage"
        fi

    - name: Upload to Release
      if: env.CHECK_IMG_IS_OK == 'true'
      uses: softprops/action-gh-release@master
      with:
        files: |
          ${{ env.OUTPUT_DIR }}/OrangeFox*.img
          ${{ env.OUTPUT_DIR }}/OrangeFox*.tar
          ${{ env.OUTPUT_DIR }}/OrangeFox*.zip
          ${{ env.OUTPUT_DIR }}/ramdisk-recovery.*
        name: Unofficial OrangeFox for ${{ matrix.device }} // ${{ env.BUILD_DATE }}
        tag_name: ${{ matrix.device }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        body: |
          Build: ${{ inputs.MANIFEST_BRANCH }}
          Device: [Device Tree/Branch](${{ inputs.DEVICE_TREE }}/tree/${{ inputs.DEVICE_TREE_BRANCH }})
          Commit: Most recent [commit](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }}) during building.
          MD5 (img): ${{ env.MD5_IMG }}
          MD5 (zip): ${{ env.MD5_ZIP }}
        prerelease: true

    - name: Run LDCheck
      if: inputs.LDCHECK == 'true'
      run: |
        cd tools
        mv -n libneeds ${{ env.OUTPUT_DIR }}/${{ matrix.device }}/recovery/root/
        mv -n ldcheck ${{ env.OUTPUT_DIR }}/${{ matrix.device }}/recovery/root/
        cd ${{ env.OUTPUT_DIR }}/${{ matrix.device }}/recovery/root
        python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECKPATH }}
        echo "Done checking missing dependencies. Review, and reconfigure your tree."
      continue-on-error: true
